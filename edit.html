<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>
<body>

<h2>Edit Student</h2>

<form method="POST">

    Student ID:<br>
    <input type="text" name="student_id" value="{{ student.student_id }}" readonly><br><br>

    Name:<br>
    <input type="text" name="name" value="{{ student.name }}" required><br><br>

    Department:<br>
    <input type="text" name="department" value="{{ student.department }}" required><br><br>

    Semester:<br>
    <input type="text" name="semester" value="{{ student.semester }}" required><br><br>

    Email:<br>
    <input type="email" name="email" value="{{ student.email }}" required><br><br>

    <input type="submit" value="Update Student">

</form>

<br>

<a href="/students">Back to Students</a>

</body>
</html>
